version: '3.8'

services:
  data_manager:
    build: .
    volumes:
      # Map local host ./data directory strictly to /data inside container
      - ./data:/data
    stdin_open: true  # Enables interactive terminal input (-i)
    tty: true         # Enables pseudo-TTY (-t)
    command: python /app/data_manager1.py /data/feedback_store.json