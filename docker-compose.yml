version: '3.8'

services:
  app:
    build: .
    volumes:
      # Mounts your local Project folder to the container's /Project folder
      - .:/Project
      # Mounts your local data folder to /data inside the container
      - ./data:/data
      # Caches your pip packages
      - pip_packages:/usr/local/lib/python3.11/site-packages
    stdin_open: true
    tty: true

volumes:
  pip_packages:
