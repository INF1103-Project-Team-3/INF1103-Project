# Settings shared by both services, written once
x-feedbacklens: &feedbacklens
  build: .
  image: feedbacklens
  volumes:
    # Mount the repo root, so the container uses your local files:
    # code changes apply without rebuilding, the API key is read from
    # managers/config/.env, and all results are saved to data/ in the repo
    - .:/Project

services:
  # Terminal mode:  docker compose run --rm app
  app:
    <<: *feedbacklens
    # Keep the terminal interactive so you can type at the prompts
    stdin_open: true
    tty: true

  # GUI mode:  docker compose up --build gui
  # then open http://localhost:6080 (or click the 6080 port link in Docker Desktop)
  gui:
    <<: *feedbacklens
    ports:
      # Only this computer can open the GUI (not other devices on the network)
      - "127.0.0.1:6080:6080"
    environment:
      # Qt draws the window on the virtual X11 screen started below
      # (Qt's own "vnc" mode drops mouse-wheel scrolling and swaps red and blue)
      DISPLAY: ":1"
      QT_QPA_PLATFORM: "xcb"
    # 1. Clear the lock left behind if this container ran before, then start the virtual screen
    # 2. Once it is up: the window manager keeps the GUI full-screen, x11vnc shares the screen,
    #    and websockify serves the FeedbackLens page (docker/gui/index.html) and relays the screen to it
    command: >
      sh -c "rm -f /tmp/.X1-lock /tmp/.X11-unix/X1;
      Xvfb :1 -screen 0 1280x800x24 -nolisten tcp > /dev/null 2>&1 &
      while [ ! -e /tmp/.X11-unix/X1 ]; do sleep 0.1; done;
      matchbox-window-manager -use_titlebar no > /dev/null 2>&1 &
      x11vnc -display :1 -rfbport 5900 -localhost -forever -shared -nopw -quiet > /dev/null 2>&1 &
      websockify --web /usr/share/novnc 6080 localhost:5900 > /dev/null 2>&1 &
      echo 'FeedbackLens GUI: open http://localhost:6080' &&
      exec python -m managers.main --gui"
